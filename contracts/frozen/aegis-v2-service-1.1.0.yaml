      - msg
      - type
      title: ValidationError
    VerifiedChainReceipt:
      properties:
        chain_id:
          type: integer
          const: 43113
          title: Chain Id
        contract_address:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          title: Contract Address
        transaction_hash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          title: Transaction Hash
        block_number:
          type: integer
          minimum: 0.0
