        digest:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
          title: Digest
        verified:
          type: boolean
          const: true
          title: Verified
      additionalProperties: false
      type: object
      required:
      - chain_id
      - contract_address
      - transaction_hash
      - block_number
      - digest
      - verified
