      - auth
      - limitations
      title: ServiceInfo
    Snapshot:
      properties:
        running:
          type: boolean
          title: Running
        run_id:
          type: string
          title: Run Id
        source_mode:
          type: string
          enum:
          - MOCK
          - MARKET_ONLY
          - OKX_DEMO
          title: Source Mode
        last_cycle_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Cycle At
        observation:
          anyOf:
          - $ref: '#/components/schemas/Observation'
          - type: 'null'
        classification:
          anyOf:
          - $ref: '#/components/schemas/Classification'
          - type: 'null'
        latest_decision:
          anyOf:
          - $ref: '#/components/schemas/Decision'
          - type: 'null'
        capabilities:
          additionalProperties:
            $ref: '#/components/schemas/Capability'
          type: object
          title: Capabilities
        identity:
          $ref: '#/components/schemas/Identity'
        execution_enabled:
          type: boolean
          title: Execution Enabled
      additionalProperties: false
      type: object
      required:
      - running
      - run_id
      - source_mode
      - last_cycle_at
      - observation
      - classification
      - latest_decision
      - capabilities
      - identity
      - execution_enabled
      title: Snapshot
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
