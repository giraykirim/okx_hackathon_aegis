openapi: 3.1.0
info:
  title: AEGIS Person 1 API
  description: Off-chain demo-only agent runtime. ERC-8004 identity is a separate
    testnet registration.
  version: 2.0.0
paths:
  /api/v1/service:
    get:
      summary: Service Info
      operationId: service_info_api_v1_service_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfo'
  /api/v1/risk/evaluate:
    post:
      summary: Evaluate Risk
      operationId: evaluate_risk_api_v1_risk_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RiskEvaluationRequest'
              - $ref: '#/components/schemas/RiskRequest-Input'
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/RiskEvaluationResponse'
                - $ref: '#/components/schemas/RiskAssessment'
                title: Response Evaluate Risk Api V1 Risk Evaluate Post
        '408':
          description: Request body deadline exceeded
        '413':
          description: Request exceeds 2048 bytes
        '409':
          description: Request ID already used for a different effective intent
        '401':
          description: Invalid service key
        '429':
          description: Busy or rate limited
        '503':
          description: Service key not configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - AEGISServiceKey: []
  /api/health:
    get:
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/snapshot:
    get:
      summary: Snapshot
      operationId: snapshot_api_snapshot_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
  /api/events:
    get:
      summary: Events
      operationId: events_api_events_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
                title: Response Events Api Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/decisions:
    get:
      summary: Decisions
      operationId: decisions_api_decisions_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Decision'
                title: Response Decisions Api Decisions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/metrics:
    get:
      summary: Metrics
      operationId: metrics_api_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
  /api/web3/identity:
    get:
      summary: Identity
      operationId: identity_api_web3_identity_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
  /api/capabilities:
    get:
      summary: Capabilities
      operationId: capabilities_api_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  $ref: '#/components/schemas/Capability'
                type: object
                title: Response Capabilities Api Capabilities Get
  /api/agent/start:
    post:
      summary: Start
      operationId: start_api_agent_start_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlState'
      security:
      - HTTPBearer: []
  /api/agent/stop:
    post:
      summary: Stop
      operationId: stop_api_agent_stop_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlState'
      security:
      - HTTPBearer: []
  /api/demo/scenario:
    post:
      summary: Scenario
      operationId: scenario_api_demo_scenario_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/stream:
    get:
      summary: Stream
      operationId: stream_api_stream_get
      parameters:
      - name: last-event-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: SSE event replay followed by new events; resume with Last-Event-ID.
          content:
            text/event-stream:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ATKReceipt:
      properties:
        id:
          type: string
          title: Id
        toolkit:
          type: string
          const: '@okx_ai/okx-trade-cli@1.4.8'
          title: Toolkit
          default: '@okx_ai/okx-trade-cli@1.4.8'
        operation:
          type: string
          enum:
          - ticker
          - instruments
          title: Operation
        command:
          items:
            type: string
          type: array
          title: Command
        site:
          type: string
          title: Site
        requested_at:
          type: string
          format: date-time
          title: Requested At
        completed_at:
          type: string
          format: date-time
          title: Completed At
        market_timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Market Timestamp
        source_mode:
          type: string
          enum:
          - MARKET_ONLY
          - OKX_DEMO
          title: Source Mode
        run_id:
          type: string
          title: Run Id
        status:
          type: string
          enum:
          - PASS
          - FAIL
          title: Status
        result_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Sha256
        stdout_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Stdout Sha256
        elapsed_ms:
          type: number
          title: Elapsed Ms
        error_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Type
      additionalProperties: false
      type: object
      required:
      - id
      - operation
      - command
      - site
      - requested_at
      - completed_at
      - market_timestamp
      - source_mode
      - run_id
      - status
      - result_sha256
      - stdout_sha256
      - elapsed_ms
      title: ATKReceipt
    Capability:
      properties:
        status:
          type: string
          enum:
          - PASS
          - FAIL
          - NOT_TESTED
          title: Status
          default: NOT_TESTED
        evidence:
          items:
            type: string
          type: array
          title: Evidence
        checked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Checked At
      additionalProperties: false
      type: object
      title: Capability
    Classification:
      properties:
        label:
          type: string
          enum:
          - CONTINUE
          - REVIEW
          - HALT
          title: Label
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        abstained:
          type: boolean
          title: Abstained
        model_version:
          type: string
          maxLength: 128
          minLength: 1
          title: Model Version
        latency_ms:
          type: number
          minimum: 0.0
          title: Latency Ms
      additionalProperties: false
      type: object
      required:
      - label
      - confidence
      - abstained
      - model_version
      - latency_ms
      title: Classification
    ControlState:
      properties:
        running:
          type: boolean
          title: Running
        run_id:
          type: string
          title: Run Id
        source_mode:
          type: string
          enum:
          - MOCK
          - MARKET_ONLY
          - OKX_DEMO
          title: Source Mode
      additionalProperties: false
      type: object
      required:
      - running
      - run_id
      - source_mode
      title: ControlState
    Decision:
      properties:
        id:
          type: string
          title: Id
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        run_id:
          type: string
          title: Run Id
        symbol:
          type: string
          const: BTC-USDT
          title: Symbol
        proposed_action:
          type: string
          enum:
          - NO_TRADE
          - BUY
          - SELL
          title: Proposed Action
        laya_label:
          type: string
          enum:
          - CONTINUE
          - REVIEW
          - HALT
          title: Laya Label
        laya_confidence:
          type: number
          title: Laya Confidence
        llm_summary:
          type: string
          title: Llm Summary
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        risk_approved:
          type: boolean
          title: Risk Approved
        risk_reasons:
          items:
            type: string
          type: array
          title: Risk Reasons
        execution_status:
          type: string
          enum:
          - NOT_SENT
          - PENDING
          - VERIFIED
          - FAILED
          - UNKNOWN
          title: Execution Status
        venue_order_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue Order Id
        source_mode:
          type: string
          enum:
          - MOCK
          - MARKET_ONLY
          - OKX_DEMO
          title: Source Mode
        intent_id:
          type: string
          title: Intent Id
        quantity:
          type: string
          title: Quantity
        venue_state:
          anyOf:
          - type: string
          - type: 'null'
          title: Venue State
        limit_price:
          anyOf:
          - type: string
          - type: 'null'
          title: Limit Price
      additionalProperties: false
      type: object
      required:
      - run_id
      - symbol
      - proposed_action
      - laya_label
      - laya_confidence
      - llm_summary
      - evidence_ids
      - risk_approved
      - risk_reasons
      - execution_status
      - source_mode
      - intent_id
      - quantity
      title: Decision
    Event:
      properties:
        id:
          type: string
          title: Id
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        run_id:
          type: string
          title: Run Id
        type:
          type: string
          title: Type
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - ERROR
          title: Severity
        actor:
          type: string
          title: Actor
        message:
          type: string
          title: Message
        details:
          additionalProperties: true
          type: object
          title: Details
        source_mode:
          type: string
          enum:
          - MOCK
          - MARKET_ONLY
          - OKX_DEMO
          title: Source Mode
      additionalProperties: false
      type: object
      required:
      - run_id
      - type
      - severity
      - actor
      - message
      - source_mode
      title: Event
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
          default: ok
        running:
          type: boolean
          title: Running
        source_mode:
          type: string
          enum:
          - MOCK
          - MARKET_ONLY
          - OKX_DEMO
          title: Source Mode
        live_execution_enabled:
          type: boolean
          const: false
          title: Live Execution Enabled
          default: false
      additionalProperties: false
      type: object
      required:
      - running
      - source_mode
      title: Health
    Identity:
      properties:
        chain_id:
          type: integer
          const: 43113
          title: Chain Id
          default: 43113
        registry_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Registry Address
        agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Id
        agent_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Uri
        owner:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
        registration_tx_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Registration Tx Hash
        tx_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Tx Hash
        verified:
          type: boolean
          title: Verified
          default: false
        verification_checked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Verification Checked At
        verification_status:
          type: string
          const: NOT_TESTED
          title: Verification Status
          default: NOT_TESTED
      additionalProperties: false
      type: object
      title: Identity
    MarketChecks:
      properties:
        status:
          type: string
          enum:
          - PASS
          - FAIL
          - UNAVAILABLE
          title: Status
        reasons:
          items:
            type: string
          type: array
          title: Reasons
        policy_limit_price:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Limit Price
      additionalProperties: false
      type: object
      required:
      - status
      - reasons
      - policy_limit_price
      title: MarketChecks
    MarketProvenance:
      properties:
        status:
          type: string
          enum:
          - PASS
          - FAIL
          - UNAVAILABLE
          title: Status
        source:
          type: string
          const: OFFICIAL_OKX_ATK
          title: Source
          default: OFFICIAL_OKX_ATK
        site:
          type: string
          title: Site
        market_timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Market Timestamp
        receipts:
          items:
            $ref: '#/components/schemas/ATKReceipt'
          type: array
          title: Receipts
      additionalProperties: false
      type: object
      required:
      - status
      - site
      - market_timestamp
      - receipts
      title: MarketProvenance
    MarketplaceStatus:
      properties:
        listing_status:
          type: string
          const: NOT_LISTED
          title: Listing Status
          default: NOT_LISTED
        integration_feasibility:
          type: string
          const: POSSIBLE
          title: Integration Feasibility
          default: POSSIBLE
        verified_listing_url:
          type: 'null'
          title: Verified Listing Url
        requirements_url:
          type: string
          title: Requirements Url
          default: https://web3.okx.com/onchainos/dev-docs/okxai/asp-introduction
      additionalProperties: false
      type: object
      title: MarketplaceStatus
    Metrics:
      properties:
        decisions:
          type: integer
          title: Decisions
        vetoed:
          type: integer
          title: Vetoed
        verified_exchange_orders:
          type: integer
          title: Verified Exchange Orders
        mock_executions:
          type: integer
          title: Mock Executions
        unresolved_orders:
          type: integer
          title: Unresolved Orders
        pnl:
          type: 'null'
          title: Pnl
      additionalProperties: false
      type: object
      required:
      - decisions
      - vetoed
      - verified_exchange_orders
      - mock_executions
      - unresolved_orders
      title: Metrics
    Observation:
      properties:
        symbol:
          type: string
          const: BTC-USDT
          title: Symbol
        observed_at:
          type: string
          format: date-time
          title: Observed At
        price:
          type: string
          title: Price
        ask:
          type: string
          title: Ask
        bid:
          type: string
          title: Bid
        min_size:
          type: string
          title: Min Size
        lot_size:
          type: string
          title: Lot Size
        tick_size:
          type: string
          title: Tick Size
          default: '0.1'
        instrument_live:
          type: boolean
          title: Instrument Live
        account_known:
          type: boolean
          title: Account Known
          default: false
        exposure_quote:
          type: string
          title: Exposure Quote
          default: '0'
        quote_available:
          type: string
          title: Quote Available
          default: '0'
        base_available:
          type: string
          title: Base Available
          default: '0'
        account_observed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Account Observed At
        external_open_orders:
          type: boolean
          title: External Open Orders
          default: false
      additionalProperties: false
      type: object
      required:
      - symbol
      - observed_at
      - price
      - ask
      - bid
      - min_size
      - lot_size
      - instrument_live
      title: Observation
    ProposedPricing:
      properties:
        status:
          type: string
          const: PROPOSED_NOT_BILLED
          title: Status
          default: PROPOSED_NOT_BILLED
        currency:
          type: string
          const: USD
          title: Currency
          default: USD
        per_assessment:
          type: string
          title: Per Assessment
          default: '0.01'
        b2b_monthly:
          type: string
          title: B2B Monthly
          default: '99'
        included_assessments:
          type: integer
          title: Included Assessments
          default: 10000
        payment_integration:
          type: string
          const: NOT_IMPLEMENTED
          title: Payment Integration
          default: NOT_IMPLEMENTED
      additionalProperties: false
      type: object
      title: ProposedPricing
    RiskAssessment:
      properties:
        assessment_id:
          type: string
          title: Assessment Id
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        run_id:
          type: string
          title: Run Id
        request:
          $ref: '#/components/schemas/RiskRequest-Output'
        source_mode:
          type: string
          const: MARKET_ONLY
          title: Source Mode
          default: MARKET_ONLY
        assessment:
          type: string
          enum:
          - REVIEW
          - HALT
          title: Assessment
        reasons:
          items:
            type: string
          type: array
          title: Reasons
        execution_authority:
          type: boolean
          const: false
          title: Execution Authority
          default: false
        order_permission:
          type: boolean
          const: false
          title: Order Permission
          default: false
        account_provenance:
          type: string
          const: UNAVAILABLE
          title: Account Provenance
          default: UNAVAILABLE
        market_provenance:
          $ref: '#/components/schemas/MarketProvenance'
        market_checks:
          $ref: '#/components/schemas/MarketChecks'
        classification:
          $ref: '#/components/schemas/Classification'
        laya_status:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
          title: Laya Status
        evren_status:
          type: string
          enum:
          - AVAILABLE
          - FALLBACK
          title: Evren Status
        analysis_summary:
          type: string
          title: Analysis Summary
        limitations:
          items:
            type: string
          type: array
          title: Limitations
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        assessment_sha256:
          type: string
          title: Assessment Sha256
      additionalProperties: false
      type: object
      required:
      - assessment_id
      - timestamp
      - run_id
      - request
      - assessment
      - reasons
      - market_provenance
      - market_checks
      - classification
      - laya_status
      - evren_status
      - analysis_summary
      - limitations
      - evidence_ids
      - assessment_sha256
      title: RiskAssessment
    RiskEvaluationRequest:
      properties:
        request_id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Request Id
        symbol:
          type: string
          const: BTC-USDT
          title: Symbol
        proposed_action:
          type: string
          enum:
          - BUY
          - SELL
          - NO_TRADE
          title: Proposed Action
        proposed_notional:
          type: string
          maxLength: 32
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,12})?$
          title: Proposed Notional
        requester_context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Requester Context
      additionalProperties: false
      type: object
      required:
      - request_id
      - symbol
      - proposed_action
      - proposed_notional
      title: RiskEvaluationRequest
    RiskEvaluationResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        verdict:
          type: string
          enum:
          - ALLOW_FOR_FURTHER_CHECKS
          - BLOCK
          - REVIEW
          - UNAVAILABLE
          title: Verdict
        execution_authorized:
          type: boolean
          const: false
          title: Execution Authorized
          default: false
        reason_codes:
          items:
            type: string
          type: array
          title: Reason Codes
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        evaluated_at:
          type: string
          format: date-time
          title: Evaluated At
        source_mode:
          type: string
          enum:
          - MOCK
          - MARKET_ONLY
          title: Source Mode
        policy_version:
          type: string
          const: risk-service-1.1.0
          title: Policy Version
          default: risk-service-1.1.0
        chain_receipt:
          anyOf:
          - $ref: '#/components/schemas/VerifiedChainReceipt'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - request_id
      - verdict
      - reason_codes
      - evidence_ids
      - evaluated_at
      - source_mode
      title: RiskEvaluationResponse
    RiskRequest-Input:
      properties:
        symbol:
          type: string
          const: BTC-USDT
          title: Symbol
        action:
          type: string
          enum:
          - BUY
          - SELL
          title: Action
        quantity:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          title: Quantity
        client_request_id:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-zA-Z0-9_-]+$
          - type: 'null'
          title: Client Request Id
      additionalProperties: false
      type: object
      required:
      - symbol
      - action
      - quantity
      title: RiskRequest
    RiskRequest-Output:
      properties:
        symbol:
          type: string
          const: BTC-USDT
          title: Symbol
        action:
          type: string
          enum:
          - BUY
          - SELL
          title: Action
        quantity:
          type: string
          title: Quantity
        client_request_id:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-zA-Z0-9_-]+$
          - type: 'null'
          title: Client Request Id
      additionalProperties: false
      type: object
      required:
      - symbol
      - action
      - quantity
      title: RiskRequest
    ScenarioRequest:
      properties:
        scenario:
          type: string
          enum:
          - normal
          - stale_feed
          - laya_halt
          - excess_exposure
          - invalid_quantity
          - missing_approval
          - unknown_order
          - duplicate_intent
          title: Scenario
      additionalProperties: false
      type: object
      required:
      - scenario
      title: ScenarioRequest
    ServiceAuth:
      properties:
        scheme:
          type: string
          const: api_key
          title: Scheme
          default: api_key
        header:
          type: string
          const: X-AEGIS-Key
          title: Header
          default: X-AEGIS-Key
        required:
          type: boolean
          const: true
          title: Required
          default: true
        configured:
          type: boolean
          title: Configured
        requests_per_minute:
          type: integer
          title: Requests Per Minute
        concurrent_assessments:
          type: integer
          const: 1
          title: Concurrent Assessments
          default: 1
        max_request_bytes:
          type: integer
          const: 2048
          title: Max Request Bytes
          default: 2048
        scope:
          type: string
          const: single deployment credential; single worker
          title: Scope
          default: single deployment credential; single worker
      additionalProperties: false
      type: object
      required:
      - configured
      - requests_per_minute
      title: ServiceAuth
    ServiceInfo:
      properties:
        name:
          type: string
          const: AEGIS Risk Check Service
          title: Name
          default: AEGIS Risk Check Service
        version:
          type: string
          const: 1.1.0
          title: Version
          default: 1.1.0
        notional_source_mode:
          type: string
          enum:
          - MOCK
          - MARKET_ONLY
          title: Notional Source Mode
        legacy_quantity_supported:
          type: boolean
          const: true
          title: Legacy Quantity Supported
          default: true
        purpose:
          type: string
          title: Purpose
          default: Operational pre-trade assessment and monitoring for trading-agent
            developers
        target_customer:
          type: string
          title: Target Customer
          default: Teams building agentic trading applications and agent-platform
            operators
        execution_authority:
          type: boolean
          const: false
          title: Execution Authority
          default: false
        public_url:
          type: 'null'
          title: Public Url
        deployment_status:
          type: string
          const: PUBLIC_NOT_VERIFIED
          title: Deployment Status
          default: PUBLIC_NOT_VERIFIED
        evaluate_path:
          type: string
          const: /api/v1/risk/evaluate
          title: Evaluate Path
          default: /api/v1/risk/evaluate
        auth:
          $ref: '#/components/schemas/ServiceAuth'
        pricing:
          $ref: '#/components/schemas/ProposedPricing'
        okx_ai:
          $ref: '#/components/schemas/MarketplaceStatus'
        limitations:
          items:
            type: string
          type: array
          title: Limitations
