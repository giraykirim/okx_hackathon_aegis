[project]
name = "aegis-backend"
version = "0.1.0"
description = "AEGIS fail-closed off-chain trading runtime"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.14", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
