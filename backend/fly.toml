# AEGIS public Risk Service. Singapore: EVREN refuses Hong Kong egress (OKX A2MCP hosting guide).
# Secrets (never in this file): fly secrets set AEGIS_SERVICE_API_KEY=... EVREN_API_KEY=... EVREN_MODEL=...
app = "aegis-okx-risk"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  AEGIS_OKX_SITE = "tr"
  AEGIS_SERVICE_PUBLIC_TIER = "true"
  AEGIS_SERVICE_PUBLIC_REQUESTS_PER_MINUTE = "3"
  AEGIS_SERVICE_REQUESTS_PER_MINUTE = "6"
  EVREN_BASE_URL = "https://evren-llmapi.ssyz.org.tr/v1"

[[mounts]]
  source = "aegis_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
